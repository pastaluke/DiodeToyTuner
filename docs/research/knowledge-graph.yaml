# DiodeToyTuner research knowledge graph
# ---------------------------------------
# Machine-readable distillation of docs/research/*.md.
# Conventions:
#   - ids are stable and dot-namespaced: family.*, protocol.*, gatt.*, app.*,
#     platform.*, hw.*, identification.*, decision.*
#   - confidence: verified-by-us | community-verified | reported
#   - every entity carries source URLs; prefer primary RE repos.
# Rules for agents: see docs/research/00-INDEX.md ("How to use the knowledge
# graph"). Never contradict this file silently; fix it in the same commit.

meta:
  updated: 2026-07-07
  scope: >
    BLE LED controller families controllable from a web app, the platform
    APIs available to reach them and to read physical inputs, and the
    hardware users can buy/build.

entities:
  # ── Vendor apps we replace ────────────────────────────────────────────
  - id: app.lotus_lantern
    type: vendor-app
    names: [Lotus Lantern, LotusLamp X, duoCo Strip]
    platform: android/ios
    source: [https://github.com/dave-code-ruiz/elkbledom]

  - id: app.magic_home
    type: vendor-app
    names: [Magic Home, Magic Home Pro, Zengge, Surp Life]
    vendor: Zengge
    source: [https://github.com/lightinglibs/flux_led]

  - id: app.happy_lighting
    type: vendor-app
    names: [HappyLighting, Triones]
    source: [https://github.com/sysofwan/ha-triones]

  - id: app.led_hue
    type: vendor-app
    names: [LED Hue]
    source: [https://gist.github.com/mbullington/37957501a07ad065b67d4e8d39bfe012]

  # ── Device families ───────────────────────────────────────────────────
  - id: family.elk_bledom
    type: device-family
    description: Most common cheap BLE RGB strip controller (many brand names)
    price_usd: [5, 15]
    channels: {r: 8bit, g: 8bit, b: 8bit, brightness: 101-steps}
    state_readback: none
    pairing: none
    confidence: community-verified
    source:
      - https://github.com/dave-code-ruiz/elkbledom
      - https://github.com/8none1/elk-bledob

  - id: family.triones
    type: device-family
    description: Cheap RGBW BLE bulbs/strips (Triones / HappyLighting apps)
    channels: {r: 8bit, g: 8bit, b: 8bit, w: 8bit}
    channel_constraint: rgb-xor-white   # firmware forbids simultaneous RGB+W
    state_readback: 12-byte status frame
    pairing: none
    confidence: community-verified
    source:
      - https://github.com/madhead/saberlight/blob/master/protocols/Triones/protocol.md
      - https://github.com/sysofwan/ha-triones

  - id: family.lednetwf
    type: device-family
    description: Zengge BLE line (rings, fairy strings, strips); Magic Home BLE side
    channels: {hue: 180-steps, saturation: 101-steps, value: 101-steps}
    per_pixel: via smear command on addressable models
    state_readback: in advertising manufacturer data (no connect needed)
    pairing: none
    confidence: community-verified
    source:
      - https://github.com/8none1/zengge_lednetwf
      - https://github.com/8none1/lednetwf_ble

  - id: family.sp110e
    type: device-family
    description: ~$5 BLE controller for addressable strips
    channels: {r: 8bit, g: 8bit, b: 8bit, brightness: 8bit, w: 8bit-on-RGBW-ICs}
    per_pixel: false   # CORRECTED 2026-07-07 — BLE protocol is whole-strip
      # only; earlier per-pixel claim was wrong. Per-pixel on sealed BLE
      # hardware = family.lednetwf smear command.
    config_tier: [ic model (32 types), rgb sequence, pixel count 1-1024]
    state_readback: GET_INFO -> 12-byte frame
    pairing: none
    quirk: init handshake immediately after connect or link drops
      (01 00 -> ffe2, then 01 b7 e3 d5 -> ffe1)
    confidence: community-verified
    source:
      - https://gist.github.com/mbullington/37957501a07ad065b67d4e8d39bfe012
      - https://github.com/roslovets/SP110E

  - id: family.bj_led
    type: device-family
    description: BJ_LED — cheapest AliExpress tier BLE strips/lamps (MohuanLED app);
      also appears inside some sunset lamps
    advertised_name: BJ_LED
    confidence: reported
    status: driver-not-started; distill protocol from source before coding
    source: [https://github.com/8none1/bj_led]

  - id: family.ideal_led
    type: device-family
    description: iDeal LED — BLE strips with a lightly encrypted (fully RE'd)
      protocol
    confidence: reported
    status: driver-not-started; att_protocol.md upstream is thorough
    source: [https://github.com/8none1/idealLED]

  - id: family.tuya_ble
    type: device-family
    description: Smart Life / Tuya BLE modules (many sunset lamps ship this) —
      authenticated + encrypted sessions keyed via Tuya cloud pairing
    reachable_from_browser: false
    verdict: out of scope; document honestly, do not fight the crypto
    confidence: community-verified
    source: [https://www.galacticnight.com.au/blogs/news/how-to-connect-sunset-lamp-to-app-unlock-easy-ambience-control-2025]

  - id: family.ledble_lamp
    type: device-family
    description: LEDBLE-class devices using the "LED Lamp" app; related led-ble
      protocol class covers QHM- names per Home Assistant LED BLE reports
    confidence: reported
    status: candidate; needs a live Diagnose report to pick the protocol variant
    source:
      - https://github.com/8none1/ledble-ledlamp
      - https://www.home-assistant.io/integrations/led_ble/

  - id: family.magichome2_ble
    type: device-family
    description: MagicHome2/SurpLife/YIQU BLE string lights
    confidence: reported
    status: driver-not-started; distill protocol from source before coding
    source: [https://github.com/rabidpaperclip/magichome2-ble]

  - id: family.zengge_wifi
    type: device-family
    description: Magic Home Wi-Fi devices; TCP port 5577; browser-unreachable
    reachable_from_browser: false
    requires: transport.bridge
    confidence: community-verified
    source: [https://github.com/lightinglibs/flux_led]

  - id: family.wled_device
    type: device-family
    description: Any ESP32/8266 running WLED; HTTP JSON API on LAN
    reachable_from_browser: partial   # mixed-content + PNA constraints
    requires: transport.bridge (clean path)
    confidence: community-verified
    source: [https://kno.wled.ge/]

  # ── Protocols / GATT endpoints ────────────────────────────────────────
  - id: protocol.elk_bledom
    type: ble-protocol
    service: 0000fff0-0000-1000-8000-00805f9b34fb
    write_char: 0000fff3-0000-1000-8000-00805f9b34fb
    notify_char: 0000fff4-0000-1000-8000-00805f9b34fb
    variant: {service: ffe0, write: ffe1, notify: ffe2}
    frame: "7e .. .. .. .. .. .. .. ef (9 bytes)"
    commands:
      power_on:  "7e 07 04 ff 00 01 02 01 ef"
      power_off: "7e 07 04 00 00 00 02 01 ef"
      set_rgb:   "7e 07 05 03 RR GG BB 10 ef"
      brightness: "7e 04 01 BB 01 ff 02 01 ef  # BB decimal 0-100"
    init_required: only some MELK-* units (7e 07 83 frames)
    confidence: community-verified
    source: [https://github.com/8none1/elk-bledob, https://github.com/dave-code-ruiz/elkbledom]

  - id: protocol.triones
    type: ble-protocol
    service: ffd5
    write_char: ffd9
    notify_char: ffd4        # under service ffd0 on some units
    commands:
      power_on:  "cc 23 33"
      power_off: "cc 24 33"
      set_rgb:   "56 RR GG BB 00 f0 aa"
      set_white: "56 00 00 00 WW 0f aa"
      set_mode:  "bb MM SS 44  # MM 0x25-0x38, SS speed 01=fast ff=slow"
      status_query: "ef 01 77"
    status_response: "66 ?? PW MD ?? ?? RR GG BB WW ?? 99 (12 bytes)"
    confidence: community-verified
    source: [https://github.com/madhead/saberlight/blob/master/protocols/Triones/protocol.md]

  - id: protocol.lednetwf
    type: ble-protocol
    service: 0000ffff-0000-1000-8000-00805f9b34fb   # variant units: 0000ff00
    write_char: 0000ff01-0000-1000-8000-00805f9b34fb
    notify_char: 0000ff02-0000-1000-8000-00805f9b34fb
    framing: "8-byte wrapper [00 SEQ 80 00 LEN_HI LEN_LO LEN+1 CMDID] +
      payload + checksum(sum of payload & 0xff); CMDID 0x0b command /
      0x0a query-expecting-response; SEQ ignored by device"
    color_model: HSV (hue/2 in one byte -> 180 steps; sat+val 0-100 -> 101 steps)
    commands:
      power_on_payload:  "3b 23 00 00 00 00 00 00 00 32 00 00  # chk 0x90"
      power_off_payload: "3b 24 00 00 00 00 00 00 00 32 00 00  # chk 0x91"
      hsv_payload:       "3b a1 HH SS VV 00 00 00 00 00 00 00"
      settings_query_payload: "81 8a 8b  # chk 0x96, cmdid 0x0a -> notification = identity probe"
      effect_payload:    "38 EE SS BB  # fw 0x53; effect 01-71, speed/bright 1-64"
    power_magic: {on: 0x23, off: 0x24}
    effects: 0x01-0x71 (fw 0x53) or 0x01-0x64 (fw 0x56)
    per_pixel_command: smear (not yet distilled)
    confidence: community-verified
    source:
      - https://github.com/8none1/zengge_lednetwf
      - https://github.com/8none1/lednetwf_ble

  - id: protocol.sp110e
    type: ble-protocol
    service: ffe0
    write_char: ffe1        # also notifies
    aux_char: ffe2          # init handshake only
    frame: 4 bytes [d0 d1 d2 CMD]; 14 commands; rename is longer
    init_sequence: ["01 00 -> ffe2", "01 b7 e3 d5 -> ffe1"]
    commands:
      led_on: "00 00 00 aa"
      led_off: "00 00 00 ab"
      set_color: "RR GG BB 1e"
      set_bright: "BB 00 00 2a   # true 256 steps"
      set_white: "WW 00 00 69"
      set_mode: "MM 00 00 2c    # 1-120 presets, 121 = static"
      get_info: "00 00 00 10    # -> 12-byte state notification"
      config_tier_dangerous: [set_ic_model 1c, set_rgb_seq 3c, set_led_num 2d]
    per_pixel: false
    confidence: community-verified
    source: [https://gist.github.com/mbullington/37957501a07ad065b67d4e8d39bfe012]

  # ── Identification evidence ───────────────────────────────────────────
  - id: identification.elk_bledom
    type: identification-evidence
    name_prefixes: [ELK-BLE, ELK-BT, ELK-BULB, MELK, LEDBLE, LED-, XROCKER, JACKYLED, DMRRBA]
    gatt_shape: [fff0+fff3+fff4, ffe0+ffe1+ffe2]
    active_probe: none (write-only family) -> blink test mandatory below 0.8
    source: [https://github.com/dave-code-ruiz/elkbledom]

  - id: identification.triones
    type: identification-evidence
    name_prefixes: [Triones, LEDBLE-]
    name_collision: LEDBLE- also claimed by family.elk_bledom; GATT decides
    gatt_shape: [ffd5+ffd9+ffd4]
    active_probe: "ef 01 77 -> expect 12-byte 66..99 frame (near-proof)"
    source: [https://github.com/madhead/saberlight/blob/master/protocols/Triones/protocol.md]

  - id: identification.lednetwf
    type: identification-evidence
    name_prefixes: [LEDnetWF]
    name_format: "LEDnetWF + 4 product hex + 8 MAC hex (e.g. LEDnetWF020027A5AE11)"
    gatt_shape: [ffff+ff01+ff02, ff00+ff01+ff02]
    active_probe: "settings query 81 8a 8b (cmdid 0x0a) -> notification on ff02 = confirmed"
    adv_manufacturer_data: carries power/color/config state pre-connect
    field_sighting: LEDnetWF020027A5AE11 (Zengge-app sunset lamp, 2026-07-07,
      via Diagnose mode; service not enumerated pre-fix because ffff was
      missing from the diagnostic candidate list)
    source: [https://github.com/8none1/zengge_lednetwf, https://github.com/8none1/lednetwf_ble]

  - id: identification.sp110e
    type: identification-evidence
    name_prefixes: [SP110E]
    warning: SP105E/SP107E/SP611E advertise similarly but speak DIFFERENT
      protocols; never cross-drive
    gatt_shape: [ffe0+ffe1(write+notify)]
    source: [https://gist.github.com/mbullington/37957501a07ad065b67d4e8d39bfe012]

  # ── Platform APIs ─────────────────────────────────────────────────────
  - id: platform.web_bluetooth
    type: web-api
    support: chromium-only (desktop + android); firefox/safari refused
    requires: secure context (https or localhost) + user gesture chooser
    key_constraints:
      - services must be declared at requestDevice time (natural allowlist)
      - GATT blocklist protects HID etc.
      - writeWithoutResponse + client pacing needed for LED frame rates
      - getDevices() enables prompt-free reconnect (persistent permissions)
    source:
      - https://developer.mozilla.org/en-US/docs/Web/API/Web_Bluetooth_API
      - https://webbluetoothcg.github.io/web-bluetooth/

  - id: platform.gamepad_api
    type: web-api
    support: all major browsers
    model: poll navigator.getGamepads(); standard mapping = 4 axes [-1,1],
      17 buttons value [0,1], analog triggers = buttons 6/7
    notes: stadia controller in BT mode = standard gamepad; pads hidden until
      first button press (fingerprint protection)
    source: [https://w3c.github.io/gamepad/]

  - id: platform.webhid
    type: web-api
    support: chromium desktop only
    use: rotary encoders, jog wheels, vendor-defined HID (RP2040 DIY knobs)
    precedent: HID Remapper configures hardware entirely via WebHID
    source: [https://wicg.github.io/webhid/, https://www.remapper.org/manual/]

  - id: platform.web_midi
    type: web-api
    support: chromium (+ firefox with prompt)
    use: knob boxes (nanoKONTROL etc.), 128-step CCs
    status: later milestone

  - id: transport.bridge
    type: planned-component
    description: optional local native helper (or Tauri build) exposing LAN
      devices (WLED HTTP, Magic Home TCP 5577, E1.31) to the app
    status: not-started

  # ── Hardware ──────────────────────────────────────────────────────────
  - id: hw.sp110e_ws2812
    type: hardware-recipe
    cost_usd: ~10
    payoff: true 256-step brightness + real white diode (SK6812 RGBW) on
      sealed BLE hardware; whole-strip only (per_pixel: false)
  - id: hw.esp32_mosfet_analog
    type: hardware-recipe
    cost_usd: ~12
    payoff: up to ~16-bit PWM per color rail via WLED (beats all 8-bit sealed gear)
    parts: [esp32 devkit, 4x IRLZ44N/AO3400, 12V PSU]
  - id: hw.quinled_dig_uno
    type: hardware-product
    role: community-standard open addressable controller for WLED
    source: [https://quinled.info/]
  - id: hw.bowl_lamp_sp110e
    type: hardware-recipe
    cost_usd: 13-17
    status: theoretical   # flip alongside docs/ways-to-use.md when built
    description: cheapest full-stack demo for users with no compatible
      device -- SP110E (USB version) + ~6px SK6812 RGBW segment under a
      diffuse bowl; USB charger or power bank
    quirk: one-time IC type (SK6812_RGBW) + pixel count setup currently
      requires vendor LED Hue app (config tier not in our UI yet, M5a)
    doc: docs/ways-to-use.md
  - id: hw.rp2040_encoder_knob
    type: hardware-recipe
    cost_usd: ~7
    payoff: physical encoder wheel -> WebHID input source; canonical light-toy build
    parts: [rp2040 board (pico/zero), EC11 encoder, circuitpython HID sketch]
  - id: hw.hid_remapper
    type: hardware-product
    role: open RP2040 firmware turning arbitrary USB inputs into clean HID
    source: [https://www.remapper.org/]

