observations:
  - id: observation.sunset_lamps_not_one_chip
    text: App-controlled sunset projection lamps are white-label BLE LED
      controllers behind a lens; they split across ELK-BLEDOM (Lotus
      Lantern/duoCo), Triones (HappyLighting), Tuya BLE (Smart Life),
      BJ_LED (MohuanLED), and iDeal LED — no single chip. The listing never
      says which; only the manual's app name (pre-purchase) or a GATT
      inspection (post-purchase) identifies the family.
    doc: docs/research/07-sunset-lamp-survey.md
  - id: observation.elk_lampl_name
    text: ELK family includes ELK-LAMPL advertised name (lamp-form factor);
      added to chooser prefixes as ELK-LAMP.
    source: [https://github.com/b1scoito/elk-led-controller]

decisions:
  - id: decision.diagnose_mode
    text: The app ships a read-only Diagnose mode (acceptAllDevices + broad
      candidate optionalServices) that reports name/GATT/driver-scores,
      because unknown name variants otherwise fail invisibly in the filtered
      chooser. Diagnose never writes. Candidate service list lives in
      app/src/diagnostics.ts and must stay in sync with this graph.
    justified_by: [observation.sunset_lamps_not_one_chip, platform.web_bluetooth]
  - id: decision.tuya_out_of_scope
    text: Tuya/Smart Life BLE devices are out of scope (authenticated,
      cloud-keyed encryption). Say so in user-facing docs rather than
      implying future support.
    justified_by: [family.tuya_ble]
  - id: decision.chromium_first
    text: Target Chromium via Web Bluetooth; no polyfills for Firefox/Safari.
      Native bridge (transport.bridge / Tauri) is the multi-browser path.
    justified_by: [platform.web_bluetooth]
  - id: decision.unit_interval_model
    text: All tunable parameters are floats in [0,1]; drivers quantize and
      report true step counts (e.g. ELK brightness = 101 steps, not 256).
    justified_by: [protocol.elk_bledom, protocol.lednetwf, family.triones]
  - id: decision.allowlist_writes
    text: GATT writes only to characteristics a positively-identified driver
      declares; identification pipeline with confidence gate + blink test.
    justified_by: [identification.elk_bledom, identification.triones, platform.web_bluetooth]
  - id: decision.write_only_shadow_state
    text: Shadow device state client-side; most families have no read-back.
    justified_by: [family.elk_bledom, family.sp110e]
  - id: decision.driver_post_connect_hook
    text: Driver interface includes postConnect() because MELK and SP110E
      need init writes or the link drops.
    justified_by: [protocol.sp110e, protocol.elk_bledom]
  - id: decision.first_drivers
    text: Ship ELK-BLEDOM (largest install base, Lotus Lantern users) and
      Triones (only family with status read-back -> proves the state loop)
      first; SP110E third (256-step brightness, white channel, init-hook
      exerciser); LEDnetWF fourth (built 2026-07-07 from a real user field
      sighting — native HSV channels, settings-query probe). All four
      shipped. Per-diode ambition still routes through the LEDnetWF smear
      command (not yet distilled).
    justified_by: [family.elk_bledom, family.triones, family.sp110e, family.lednetwf]
  - id: decision.effects_out_of_scope
    text: Built-in vendor effects are exposed minimally or not at all;
      LedFx/vendor apps own that space. We own precision manual control.
    justified_by: [family.elk_bledom, family.lednetwf]
